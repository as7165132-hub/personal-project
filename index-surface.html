<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SURFACE DEBUT — 26SS: 아키타입 해체·겹의 자아 발현" />

    <title>SURFACE DEBUT</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      /* Critical CSS for initial load */
      body {
        margin: 0;
        padding: 0;
        background: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #app {
        width: 100vw;
        min-height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
      }

      /* Loading state */
      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 0.875rem;
        color: #8a8a8a;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <!-- Main Container -->
    <div id="app">
      <div class="loading">Loading…</div>
    </div>

    <!-- WebGL Canvas (injected by GL3DLayer) -->

    <!-- Main Script -->
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
