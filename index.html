<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Shopping Mall</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <h1 class="logo">🛍️ Simple Shop</h1>
            <nav>
                <button class="cart-btn" id="cartBtn">
                    🛒 장바구니 (<span id="cartCount">0</span>)
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Products Section -->
        <section class="products-section">
            <h2>상품 목록</h2>
            <div class="products-grid" id="productsGrid">
                <!-- Products will be dynamically loaded here -->
            </div>
        </section>

        <!-- Cart Modal -->
        <div class="modal" id="cartModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>장바구니</h2>
                    <button class="close-btn" id="closeBtn">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="cartItems">
                        <p class="empty-cart">장바구니가 비어있습니다.</p>
                    </div>
                    <div class="cart-total">
                        <h3>총 금액: <span id="totalPrice">0</span>원</h3>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="clearCartBtn">장바구니 비우기</button>
                    <button class="btn btn-primary" id="checkoutBtn">주문하기</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 Simple Shopping Mall. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
